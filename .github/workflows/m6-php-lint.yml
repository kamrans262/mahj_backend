name: M6 PHP Lint

on:
  push:
    branches:
      - chat

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP
        run: find app routes database -name '*.php' -print0 | xargs -0 -n1 php -l
